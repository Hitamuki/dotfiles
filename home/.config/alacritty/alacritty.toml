# Alacritty設定
# 公式ドキュメント: https://alacritty.org/config-alacritty.html

[general]
live_config_reload = true

[window]
opacity = 0.7        # iTerm2の透明度設定（30%）に合わせる
padding = { x = 8, y = 8 }
decorations = "full"

[font]
size = 13.0

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "On" }

# カラーテーマ: iTerm2で使用しているiceberg（config/iterm2/themes/iceberg.itermcolors）に合わせる
[colors.primary]
background = "#161821"
foreground = "#c6c8d1"

[colors.cursor]
text = "#161821"
cursor = "#c6c8d1"

[colors.selection]
text = "CellForeground"
background = "#272c42"

[colors.normal]
black = "#1e2132"
red = "#e27878"
green = "#b4be82"
yellow = "#e2a478"
blue = "#84a0c6"
magenta = "#a093c7"
cyan = "#89b8c2"
white = "#c6c8d1"

[colors.bright]
black = "#6b7089"
red = "#e98989"
green = "#c0ca8e"
yellow = "#e9b189"
blue = "#91acd1"
magenta = "#ada0d3"
cyan = "#95c4ce"
white = "#d2d4de"
